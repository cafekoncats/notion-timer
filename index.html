
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css?family=Inter:400,500,600">

  <title>Countdown Timer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      background: #191919;
      font-family: 'Inter', sans-serif;
    }

    #timer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 100%;
      color: #a6a6a6;
      text-align: center;
    }

    .unit {
      flex: 1;
      min-width: 0;
      padding: 18px 6px 14px;
      background: #222222;
      border: 1px solid #303030;
      border-radius: 8px;
    }

    .numbers {
      color: #e5e5e5;
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
      letter-spacing: -1px;
    }

    .label {
      margin-top: 8px;
      color: #858585;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    @media (max-width: 360px) {
      #timer {
        gap: 6px;
      }

      .unit {
        padding: 14px 3px 12px;
      }

      .label {
        font-size: 0.55rem;
        letter-spacing: 1px;
      }
    }
  </style>
</head>

<body>

  <div id="timer">
    <div class="unit">
      <div id="days" class="numbers">00</div>
      <div class="label">Days</div>
    </div>

    <div class="unit">
      <div id="hours" class="numbers">00</div>
      <div class="label">Hours</div>
    </div>

    <div class="unit">
      <div id="minutes" class="numbers">00</div>
      <div class="label">Minutes</div>
    </div>

    <div class="unit">
      <div id="seconds" class="numbers">00</div>
      <div class="label">Seconds</div>
    </div>
  </div>

  <script>
    // Set your target date and time here.
    const targetDate = new Date('Oct 15, 2026 10:00:00').getTime();

    const elements = {
      days: document.getElementById('days'),
      hours: document.getElementById('hours'),
      minutes: document.getElementById('minutes'),
      seconds: document.getElementById('seconds')
    };

    function updateTimer() {
      const diff = Math.max(0, targetDate - Date.now());

      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const minutes = Math.floor((diff % 3600000) / 60000);
      const seconds = Math.floor((diff % 60000) / 1000);

      elements.days.textContent = String(days).padStart(2, '0');
      elements.hours.textContent = String(hours).padStart(2, '0');
      elements.minutes.textContent = String(minutes).padStart(2, '0');
      elements.seconds.textContent = String(seconds).padStart(2, '0');

      if (diff === 0) {
        clearInterval(timer);
      }
    }

    updateTimer();
    const timer = setInterval(updateTimer, 1000);
  </script>

</body>
</html>
